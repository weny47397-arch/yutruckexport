<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="60%" stop-color="#c8102e"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </radialGradient>
    <linearGradient id="truckBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="cargo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="window" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8dadc"/>
      <stop offset="100%" stop-color="#457b9d"/>
    </linearGradient>
    <radialGradient id="wheel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d3d3d"/>
      <stop offset="80%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
  </defs>
  
  <!-- Background circle (red SHACMAN brand) -->
  <circle cx="320" cy="320" r="320" fill="url(#bg)"/>
  
  <!-- Subtle radial shadow -->
  <ellipse cx="320" cy="500" rx="280" ry="40" fill="#000" opacity="0.25"/>
  
  <!-- SHACMAN truck silhouette - simplified side view -->
  <g transform="translate(80, 230)">
    <!-- Cargo/dump body (large box on right) -->
    <rect x="180" y="40" width="220" height="120" rx="4" fill="url(#cargo)" stroke="#000" stroke-width="2"/>
    <!-- Cargo top edge highlight -->
    <rect x="180" y="40" width="220" height="6" fill="#fff" opacity="0.15"/>
    
    <!-- Cab (driver compartment - left front) -->
    <path d="M 20  160 L 20  40 L 80  40 L 130  40 L 140  90 L 180  90 L 180  160 Z" 
          fill="url(#truckBody)" stroke="#000" stroke-width="2"/>
    
    <!-- Cab window -->
    <path d="M 35  50 L 80  50 L 130  50 L 135  85 L 35  85 Z" 
          fill="url(#window)" stroke="#000" stroke-width="1.5"/>
    
    <!-- Window divider -->
    <line x1="85" y1="50" x2="85" y2="85" stroke="#000" stroke-width="1.5"/>
    
    <!-- Door handle -->
    <rect x="40" y="105" width="20" height="3" rx="1" fill="#888"/>
    
    <!-- Front bumper / detail -->
    <rect x="20" y="140" width="30" height="20" fill="#0d1117" stroke="#000" stroke-width="1"/>
    
    <!-- Headlight -->
    <rect x="25" y="115" width="12" height="8" rx="2" fill="#ffe066"/>
    
    <!-- Chassis line -->
    <line x1="0" y1="160" x2="420" y2="160" stroke="#000" stroke-width="3"/>
    
    <!-- Wheels - 6 wheels for heavy truck -->
    <circle cx="60" cy="170" r="22" fill="url(#wheel)" stroke="#000" stroke-width="2"/>
    <circle cx="60" cy="170" r="10" fill="#444" stroke="#666" stroke-width="1"/>
    <circle cx="60" cy="170" r="4" fill="#888"/>
    
    <circle cx="160" cy="170" r="22" fill="url(#wheel)" stroke="#000" stroke-width="2"/>
    <circle cx="160" cy="170" r="10" fill="#444" stroke="#666" stroke-width="1"/>
    <circle cx="160" cy="170" r="4" fill="#888"/>
    
    <circle cx="220" cy="170" r="22" fill="url(#wheel)" stroke="#000" stroke-width="2"/>
    <circle cx="220" cy="170" r="10" fill="#444" stroke="#666" stroke-width="1"/>
    <circle cx="220" cy="170" r="4" fill="#888"/>
    
    <circle cx="280" cy="170" r="22" fill="url(#wheel)" stroke="#000" stroke-width="2"/>
    <circle cx="280" cy="170" r="10" fill="#444" stroke="#666" stroke-width="1"/>
    <circle cx="280" cy="170" r="4" fill="#888"/>
    
    <circle cx="340" cy="170" r="22" fill="url(#wheel)" stroke="#000" stroke-width="2"/>
    <circle cx="340" cy="170" r="10" fill="#444" stroke="#666" stroke-width="1"/>
    <circle cx="340" cy="170" r="4" fill="#888"/>
    
    <circle cx="400" cy="170" r="22" fill="url(#wheel)" stroke="#000" stroke-width="2"/>
    <circle cx="400" cy="170" r="10" fill="#444" stroke="#666" stroke-width="1"/>
    <circle cx="400" cy="170" r="4" fill="#888"/>
  </g>
  
  <!-- SHACMAN text badge at bottom -->
  <rect x="160" y="510" width="320" height="58" rx="8" fill="#1a1a2e" opacity="0.95"/>
  <text x="320" y="552" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" 
        font-size="36" font-weight="900" fill="#fff" letter-spacing="3">SHACMAN</text>
  
  <!-- Subtle "EXPORT" subtext -->
  <text x="320" y="585" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="11" fill="#c8102e" letter-spacing="6" font-weight="600">EXPORT</text>
  
  <!-- Highlight gloss -->
  <ellipse cx="180" cy="120" rx="180" ry="60" fill="#fff" opacity="0.08"/>
</svg>
