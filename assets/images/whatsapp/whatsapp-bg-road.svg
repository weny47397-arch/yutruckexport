<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8c42"/>
      <stop offset="30%" stop-color="#ffb86c"/>
      <stop offset="60%" stop-color="#ffd89b"/>
      <stop offset="100%" stop-color="#f4e4c1"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#8b6239"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="truckBig" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
  </defs>
  
  <!-- Sunset sky -->
  <rect width="1920" height="650" fill="url(#sky3)"/>
  
  <!-- Sun -->
  <circle cx="960" cy="500" r="100" fill="#fff7ad" opacity="0.6"/>
  <circle cx="960" cy="500" r="60" fill="#ffe066" opacity="0.9"/>
  
  <!-- Sun rays -->
  <g opacity="0.3">
    <line x1="100" y1="500" x2="1820" y2="500" stroke="#ffe066" stroke-width="3"/>
    <line x1="200" y1="300" x2="1720" y2="500" stroke="#ffe066" stroke-width="2"/>
    <line x1="200" y1="700" x2="1720" y2="500" stroke="#ffe066" stroke-width="2"/>
    <line x1="400" y1="200" x2="1500" y2="500" stroke="#ffe066" stroke-width="2"/>
    <line x1="400" y1="800" x2="1500" y2="500" stroke="#ffe066" stroke-width="2"/>
  </g>
  
  <!-- Distant mountains/savanna -->
  <path d="M 0 580 L 200 480 L 400 520 L 600 460 L 800 500 L 1000 450 L 1200 510 L 1400 470 L 1600 520 L 1800 480 L 1920 540 L 1920 650 L 0 650 Z" 
        fill="#a67c52" opacity="0.7"/>
  
  <!-- Acacia tree silhouettes (African savanna) -->
  <g opacity="0.7" fill="#4a3528">
    <!-- Tree 1 (left) -->
    <ellipse cx="250" cy="540" rx="45" ry="12"/>
    <line x1="250" y1="540" x2="250" y2="620" stroke="#4a3528" stroke-width="3"/>
    <line x1="250" y1="570" x2="220" y2="540" stroke="#4a3528" stroke-width="2"/>
    <line x1="250" y1="570" x2="280" y2="540" stroke="#4a3528" stroke-width="2"/>
    
    <!-- Tree 2 (right) -->
    <ellipse cx="1700" cy="530" rx="50" ry="14"/>
    <line x1="1700" y1="530" x2="1700" y2="620" stroke="#4a3528" stroke-width="3"/>
    <line x1="1700" y1="560" x2="1660" y2="530" stroke="#4a3528" stroke-width="2"/>
    <line x1="1700" y1="560" x2="1740" y2="530" stroke="#4a3528" stroke-width="2"/>
  </g>
  
  <!-- Ground/savanna -->
  <rect y="620" width="1920" height="460" fill="url(#ground)"/>
  
  <!-- Distant ground line -->
  <line x1="0" y1="620" x2="1920" y2="620" stroke="#5d4037" stroke-width="2" opacity="0.5"/>
  
  <!-- Road -->
  <polygon points="0,720 1920,650 1920,820 0,900" fill="url(#road)"/>
  
  <!-- Road centerline (dashed) -->
  <line x1="0" y1="790" x2="1920" y2="730" stroke="#ffd60a" stroke-width="6" stroke-dasharray="50 30"/>
  
  <!-- Road edge lines -->
  <line x1="0" y1="720" x2="1920" y2="650" stroke="#fff" stroke-width="3" opacity="0.4"/>
  <line x1="0" y1="900" x2="1920" y2="820" stroke="#fff" stroke-width="3" opacity="0.4"/>
  
  <!-- SHACMAN truck (foreground, large) -->
  <g transform="translate(600, 600)">
    <!-- Cargo body -->
    <rect x="280" y="60" width="420" height="140" rx="4" fill="url(#truckBig)" stroke="#000" stroke-width="2"/>
    <rect x="280" y="60" width="420" height="6" fill="#fff" opacity="0.2"/>
    <!-- SHACMAN logo on truck -->
    <text x="490" y="155" text-anchor="middle" font-family="Arial Black" font-size="42" font-weight="900" fill="#fff" letter-spacing="3">SHACMAN</text>
    
    <!-- Cab -->
    <path d="M 40 200 L 40 60 L 130 60 L 200 60 L 220 130 L 280 130 L 280 200 Z" 
          fill="url(#truckBig)" stroke="#000" stroke-width="2"/>
    
    <!-- Cab window -->
    <path d="M 60 80 L 130 80 L 200 80 L 215 125 L 60 125 Z" 
          fill="#a8dadc" stroke="#000" stroke-width="1.5"/>
    <line x1="140" y1="80" x2="140" y2="125" stroke="#000" stroke-width="1.5"/>
    
    <!-- Door handle -->
    <rect x="70" y="155" width="30" height="4" rx="1" fill="#888"/>
    
    <!-- Front bumper -->
    <rect x="40" y="180" width="40" height="20" fill="#0d1117"/>
    
    <!-- Headlight -->
    <rect x="50" y="145" width="16" height="12" rx="2" fill="#ffe066"/>
    
    <!-- Chassis -->
    <line x1="0" y1="200" x2="720" y2="200" stroke="#000" stroke-width="4"/>
    
    <!-- Wheels (8 for big cargo) -->
    <circle cx="80" cy="225" r="28" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
    <circle cx="80" cy="225" r="13" fill="#444"/>
    
    <circle cx="220" cy="225" r="28" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
    <circle cx="220" cy="225" r="13" fill="#444"/>
    
    <circle cx="340" cy="225" r="28" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
    <circle cx="340" cy="225" r="13" fill="#444"/>
    
    <circle cx="460" cy="225" r="28" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
    <circle cx="460" cy="225" r="13" fill="#444"/>
    
    <circle cx="560" cy="225" r="28" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
    <circle cx="560" cy="225" r="13" fill="#444"/>
    
    <circle cx="640" cy="225" r="28" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
    <circle cx="640" cy="225" r="13" fill="#444"/>
    
    <!-- Exhaust smoke -->
    <g opacity="0.6">
      <circle cx="265" cy="60" r="20" fill="#fff" opacity="0.5"/>
      <circle cx="270" cy="40" r="25" fill="#fff" opacity="0.4"/>
      <circle cx="280" cy="20" r="30" fill="#fff" opacity="0.3"/>
    </g>
  </g>
  
  <!-- Brand text -->
  <text x="60" y="1040" font-family="Arial Black" font-size="28" font-weight="900" fill="#c8102e">SHACMAN</text>
  <text x="60" y="1065" font-family="Arial" font-size="13" fill="#1a1a2e">EXPORT TO AFRICA · FACTORY DIRECT</text>
  
  <!-- Distance/perspective dust -->
  <ellipse cx="900" cy="950" rx="800" ry="30" fill="#d4a574" opacity="0.4"/>
</svg>
